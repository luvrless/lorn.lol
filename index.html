<!DOCTYPE html>

<meta charset="UTF-8">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html {
    height: 100%;
    background: #04080f;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
}

body {
    min-height: 100vh;
    min-height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    display: grid;
    place-items: center;
    overflow: hidden;
    background: #04080f;
    color: #eef4fc;
    font-family: "Helvetica Neue", Inter, "Segoe UI", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
}

.glow {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse 60% 50% at 50% 50%, rgba(40, 90, 160, .18), transparent 70%);
    animation: glow-in 2.4s cubic-bezier(.22, 1, .36, 1) both;
}

@keyframes glow-in {
    from { opacity: 0; transform: scale(.6); }
    to   { opacity: 1; transform: none; }
}

h1 {
    position: relative;
    white-space: nowrap;
    font-size: clamp(30px, min(11vw, 20vh), 96px);
    line-height: 1.1;
    font-weight: 300;
    letter-spacing: -0.03em;
    animation: reveal 1.4s cubic-bezier(.16, 1, .3, 1) .5s both;
}

.ghost { visibility: hidden; }

.live {
    position: absolute;
    left: 0;
    top: 0;
}

.typed {
    background: linear-gradient(180deg, #ffffff 30%, #9fbbe0);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
}

.cursor {
    display: inline-block;
    width: max(2px, .03em);
    height: .85em;
    margin-left: .06em;
    vertical-align: -0.05em;
    background: #b9d3f2;
    animation: blink 1s ease-in-out infinite;
}

@keyframes blink {
    0%, 45%   { opacity: 1; }
    55%, 100% { opacity: 0; }
}

@keyframes reveal {
    from { opacity: 0; filter: blur(10px); transform: translateY(14px) scale(.97); }
    to   { opacity: 1; filter: blur(0);   transform: none; }
}

/* Small phones: a touch more breathing room at the edges */
@media (max-width: 360px) {
    h1 { letter-spacing: -0.02em; }
}

/* Large / high-res screens */
@media (min-width: 1600px) {
    h1 { font-size: clamp(96px, min(6vw, 20vh), 140px); }
}

@media (prefers-reduced-motion: reduce) {
    .glow, h1 { animation: none; }
}
</style>
</head>
<body>
<div class="glow"></div>
<h1 aria-label="Coming soon">
    <span class="ghost" aria-hidden="true">Coming soon</span>
    <span class="live" aria-hidden="true"><span class="typed" id="typed"></span><span class="cursor"></span></span>
</h1>
<script>
const text = "Coming soon";
const el = document.getElementById("typed");
const PAUSE = 1500;
let i = 0, deleting = false;

function tick() {
    el.textContent = text.slice(0, i);
    if (!deleting) {
        if (i < text.length) { i++; setTimeout(tick, 90 + Math.random() * 50); }
        else { deleting = true; setTimeout(tick, PAUSE); }
    } else {
        if (i > 0) { i--; setTimeout(tick, 45); }
        else { deleting = false; setTimeout(tick, PAUSE); }
    }
}
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
setTimeout(tick, reduced ? 0 : 1300);

document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("selectstart", e => e.preventDefault());
document.addEventListener("dragstart", e => e.preventDefault());
</script>
</body>
</html>
