
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming soon</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #030914;
    font-family: Inter, "Segoe UI", sans-serif;
    color: #eaf4ff;
}

/* Background */
.background {
    position: fixed;
    inset: 0;
    background:
        radial-gradient(ellipse at 20% 20%, rgba(17, 73, 139, .25), transparent 55%),
        radial-gradient(ellipse at 80% 75%, rgba(15, 53, 112, .3), transparent 55%),
        linear-gradient(145deg, #050d1b, #07162b, #030914);
    animation: ambient 12s ease-in-out infinite alternate;
}

@keyframes ambient {
    from { filter: brightness(.8); }
    to { filter: brightness(1.3); }
}

/* Glass panel */
.glass {
    position: relative;
    z-index: 1;
    padding: 65px 90px;
    border-radius: 24px;
    background: rgba(14, 37, 67, .28);
    border: 1px solid rgba(142, 190, 255, .12);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    box-shadow:
        0 25px 80px rgba(0, 0, 0, .35),
        inset 0 1px 1px rgba(255, 255, 255, .08),
        0 0 80px rgba(24, 91, 173, .08);
    animation: appear 1.2s cubic-bezier(.16, 1, .3, 1) both;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(20px) scale(.96);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* Typing text */
.typing {
    font-size: clamp(32px, 5vw, 58px);
    font-weight: 600;
    letter-spacing: -2px;
    white-space: nowrap;
    background: linear-gradient(120deg, #ffffff, #a9cfff, #e0edff);
    background-clip: text;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    min-height: 1.2em;
}

.cursor {
    display: inline-block;
    width: 3px;
    height: .9em;
    margin-left: 5px;
    vertical-align: -2px;
    background: #8fc5ff;
    animation: blink .8s steps(2, start) infinite;
}

@keyframes blink {
    to { visibility: hidden; }
}

@media (max-width: 500px) {
    .glass {
        padding: 45px 30px;
        border-radius: 18px;
    }

    .typing {
        letter-spacing: -1px;
    }
}
</style>
</head>

<body>

<div class="background"></div>

<main class="glass">
    <div class="typing">
        <span id="typed"></span><span class="cursor"></span>
    </div>
</main>

<script>
const text = "Coming soon";
const element = document.getElementById("typed");

let index = 0;
let deleting = false;

function typeLoop() {
    element.textContent = text.substring(0, index);

    if (!deleting && index < text.length) {
        index++;
        setTimeout(typeLoop, 120);
    } 
    else if (!deleting && index === text.length) {
        deleting = true;
        setTimeout(typeLoop, 1800);
    } 
    else if (deleting && index > 0) {
        index--;
        setTimeout(typeLoop, 75);
    } 
    else {
        deleting = false;
        setTimeout(typeLoop, 600);
    }
}

typeLoop();
</script>

</body>
</html>
